type: marvin_deform
dataset_dir: ???             # Converted pick_place_2_3_openwam_v3, not raw bags.
tactile_manifest_path: ???   # Audited, aligned uint8 deform sidecars; see docs/touchwam/regions.md.
action_mode: eef
unify_action: true
unify_action_map: [0-8, 10-31, 34-42, 44-65]
unify_state_map: [0-8, 10-31, 34-42, 44-65]
normalize_mode: min-max
num_frames: 33
video_stride: 4
window_stride: 1
height: 384
width: 320
multiview: true
camera_layout: [observation.images.left_head, observation.images.left_wrist, observation.images.right_wrist]
color_jitter:
  enabled: false
tactile_history: ${model.architecture.tactile.history}
tactile_map_size: ${model.architecture.tactile.map_size}
tactile_future_frames: ${model.architecture.tactile.future_frames}
tactile_future_stride: ${model.architecture.tactile.future_stride}
tactile_fps: ${model.architecture.tactile.fps}
