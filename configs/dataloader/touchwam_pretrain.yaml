# Reuse previously validated EgoDex / AgiBot / Sharpa data in place.
# Only new FTP conversion and Sharpa tactile sidecars use data_root.
# Infrastructure recipe only; the latest data-budget proposal is in
# docs/data/pretrain_data_budget_20261028.md. Bulk FTP conversion is stopped.
# Do not treat proportional defaults as the proposed 30/30/15/25 training budget.
# Data publication must be complete before training. Hour budgets remain optional.
# FTP-1 sharpa is intentionally absent; do not add it alongside native SharpaDex.
type: mixture
weight_strategy: proportional
data_root: ${oc.env:TOUCHWAM_DATA_ROOT,/mnt/pfs/v89atp/workspace/dataset/touchwam_pretrain_v1_20261028}
datasets:
  egodex:
    type: egodex_reuse_video
    require_publication: true
    strict_buckets: true
    dataset_dir: ${oc.env:TOUCHWAM_EGODEX_ROOT,/mnt/pfs/v89atp/workspace/dataset/egodex_300h_video_v1}
    tactile_mode: off
    total_hours: null
    num_frames: 33
    video_stride: 4
    sampling_fps: 30
    height: 384
    width: 320
    camera_layout: [observation.images.camera, __missing_left__, __missing_right__]
    color_jitter: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.0}
  sharpadex:
    type: sharpadex_native_intensity
    require_publication: true
    strict_buckets: true
    dataset_dir: ${oc.env:TOUCHWAM_SHARPA_ROOT,/mnt/pfs/v89atp/workspace/dataset/sharpadex_native_tcp_v1_20261026/buckets}
    tactile_root: ${dataloader.data_root}/sharpadex
    action_mode: eef
    unify_action: true
    unify_action_map: [0-8, 10-31, 34-42, 44-65]
    unify_state_map: [0-8, 10-31, 34-42, 44-65]
    normalize_mode: min-max
    num_frames: 33
    video_stride: 4
    window_stride: 1
    height: 384
    width: 320
    multiview: true
    tactile_map_size: 32
    total_hours: null
    color_jitter: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.0}
  agibot:
    type: agibotworld
    require_publication: true
    strict_buckets: true
    dataset_dir: ${oc.env:TOUCHWAM_AGIBOT_ROOT,/mnt/pfs/v89atp/workspace/dataset/agibot_pretrain_v1}
    action_mode: eef
    unify_action: true
    normalize_mode: quantile
    enable_action_supervision: true
    use_segment_annotations: false
    total_hours: null
    num_frames: 33
    video_stride: 4
    window_stride: 1
    height: 384
    width: 320
    multiview: true
    color_jitter: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.0}
  ftp_freetacman:
    type: lerobot_video_intensity
    require_publication: true
    strict_buckets: true
    dataset_dir: ${dataloader.data_root}/ftp1/FreeTacMan
